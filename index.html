<!DOCTYPE html>
<html lang="en">
<head>
  <title>Pratilipi — Minimal Notes</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111111;
      --muted: #6b7280;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --hover: #f3f4f6;
      --line-color: #d1d5db;
      --highlight-color: #9ca3af;
      --radius: 10px;
    }

    .dark-mode {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #f5f5f5;
      --muted: #9ca3af;
      --border: #262626;
      --border-strong: #404040;
      --hover: #1f1f1f;
      --line-color: #404040;
      --highlight-color: #525252;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.09);
    }

    .icon-btn:active {
      transform: translateY(0);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .icon-btn svg { width: 18px; height: 18px; }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn {
      appearance: none;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      background: var(--hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.09);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .btn.danger:hover {
      color: #dc2626;
      border-color: #fca5a5;
    }

    .dark-mode .btn.danger:hover {
      color: #f87171;
      border-color: #7f1d1d;
    }

    select.btn {
      padding-right: 8px;
    }

    select.btn option {
      background: var(--surface);
      color: var(--text);
    }

    .toolbar-sep {
      width: 1px;
      align-self: stretch;
      background: var(--border);
      margin: 4px 2px;
    }

    /* Info line */
    .info-line {
      font-size: 12.5px;
      color: var(--muted);
      margin: 14px 0 18px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .info-line .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }

    /* Editor */
    textarea {
      width: 100%;
      min-height: 58vh;
      padding: 22px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.9;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s ease, background 0.25s ease;
      background-attachment: local;
    }

    textarea:focus {
      border-color: var(--border-strong);
    }

    .page-none textarea { background-image: none; }

    .page-one textarea {
      background-image: repeating-linear-gradient(to bottom, var(--line-color), var(--line-color) 1px, transparent 1px, transparent 34px);
      background-size: 100% 34px;
      line-height: 34px;
    }

    .page-four textarea {
      background-image:
        linear-gradient(to bottom, var(--highlight-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--highlight-color) 1px, transparent 1px);
      background-size: 100% 136px;
      background-position: 0 0, 0 34px, 0 68px, 0 102px;
      line-height: 34px;
    }

    .footer {
      text-align: center;
      margin-top: 36px;
      font-size: 12.5px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .page { padding: 24px 16px 40px; }
      .toolbar-sep { display: none; }
    }
  </style>
</head>
<body class="page-none">

  <div class="page">
    <div class="header">
      <div class="brand">
        <h1>Pratilipi</h1>
        <p>Your stories start here.</p>
      </div>
      <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle dark mode" id="modeToggle" aria-label="Toggle dark mode"></button>
    </div>

    <div class="toolbar">
      <button class="btn" onclick="saveNote()">Save</button>
      <button class="btn" onclick="copyNote()">Copy</button>
      <button class="btn" onclick="shareNote()">Share</button>
      <button class="btn" onclick="downloadNote()">Download</button>
      <button class="btn" onclick="printNote()">Print</button>
      <button class="btn danger" onclick="clearNote()">Clear</button>
      <div class="toolbar-sep"></div>
      <select class="btn" onchange="setPageType(this.value)" aria-label="Page style">
        <option value="page-none">Plain</option>
        <option value="page-one">Ruled</option>
        <option value="page-four">Ruled+</option>
      </select>
      <select class="btn" onchange="setTheme(this.value)" id="colorSelect" aria-label="Theme">
        <option value="white">White</option>
        <option value="lightgreen">Green</option>
        <option value="lightcyan">Teal</option>
        <option value="lightblue">Blue</option>
        <option value="plum">Purple</option>
        <option value="tan">Brown</option>
        <option value="lightpink">Pink</option>
        <option value="lightgray">Gray</option>
        <option value="darkgray">Dark gray</option>
      </select>
    </div>

    <div class="info-line"><span class="dot"></span>Private — stored only in this browser.</div>

    <textarea id="noteArea" oninput="autoSave()" placeholder="Start writing…"></textarea>

    <div class="footer">Made by sauravhhh</div>
  </div>

  <script>
    const textarea = document.getElementById("noteArea");
    const body = document.body;
    const modeBtn = document.getElementById("modeToggle");

    const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';

    function autoSave() {
      localStorage.setItem("note", textarea.value);
    }

    function saveNote() {
      localStorage.setItem("note", textarea.value);
      alert("Note saved offline.");
    }

    function loadNote() {
      const saved = localStorage.getItem("note");
      if (saved) textarea.value = saved;
    }

    function clearNote() {
      if (confirm("Clear the note?")) {
        textarea.value = "";
        localStorage.removeItem("note");
      }
    }

    function downloadNote() {
      const content = textarea.value;
      const html = "<!DOCTYPE html><html><body><pre>" + content.replace(/</g, "&lt;") + "</pre></body></html>";
      const blob = new Blob([html], {type: "text/html"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "my_note.html";
      a.click();
    }

    function printNote() {
      const win = window.open("", "", "width=800,height=600");
      win.document.write("<pre>" + textarea.value.replace(/</g, "&lt;") + "</pre>");
      win.document.close();
      win.print();
    }

    function shareNote() {
      if (navigator.share) {
        navigator.share({
          title: "My Notes",
          text: textarea.value
        }).catch(err => console.log("Share canceled or failed", err));
      } else {
        alert("Sharing not supported on this device.");
      }
    }

    function copyNote() {
      textarea.select();
      document.execCommand('copy');
      alert("Copied to clipboard.");
    }

    function setPageType(type) {
      body.classList.remove("page-none", "page-one", "page-four");
      body.classList.add(type);
    }

    function toggleDarkMode() {
      body.classList.toggle("dark-mode");
      modeBtn.innerHTML = body.classList.contains("dark-mode") ? SUN_SVG : MOON_SVG;

      // Reset color dropdown to white when switching to/from dark mode
      if (body.classList.contains("dark-mode")) {
        document.getElementById('colorSelect').value = 'white';
      }
    }

    function setTheme(color) {
      body.classList.remove("dark-mode");
      const root = document.documentElement.style;
      root.setProperty('--bg', color);
      root.setProperty('--surface', color);
      root.setProperty('--text', 'black');
      root.setProperty('--muted', '#6b7280');
      modeBtn.innerHTML = MOON_SVG;

      if (color === 'darkgray') {
        root.setProperty('--text', 'white');
        root.setProperty('--muted', '#9ca3af');
      }

      // Update the dropdown selection
      const colorSelect = document.getElementById('colorSelect');
      colorSelect.value = color;
    }

    // Initialize
    modeBtn.innerHTML = MOON_SVG;
    loadNote();
  </script>

</body>
</html>
